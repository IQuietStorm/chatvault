# ChatVault TURN server (Coturn) — NAT traversal fallback for WebRTC 1:1 calls.
# Media only: peer-to-peer whenever possible, TURN relay when symmetric NATs block P2P.
# REST-style ephemeral credentials are generated server-side (CallsService, RFC 7635):
#   username = "<unix-expiry>:<user-id>", credential = base64(HMAC-SHA1(secret, username))
# Change static-auth-secret and keep it in sync with server .env TURN_SECRET.

listening-port=3478
fingerprint
lt-cred-mech   # classic long-term creds (optional; REST secret is preferred)
use-auth-secret
static-auth-secret=change-me-turn-secret
realm=chatvault.app

stale-nonce=600
no-multicast-peers
min-port=49160
max-port=49200

# Production: terminate TLS/DTLS here with real certs
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem
# no-tls-disable  -> comment out to enable 5349

# Behave politely on cloud NATs
fingerprint
mobility

# Logging
verbose
log-file=/var/log/coturn/turnserver.log
